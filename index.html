<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访问验证 · Build a Reasoning Model</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --border:#30363d; --fg:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff; --accent2:#3fb950; --pdf:#f85149; --err:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1100px 550px at 50% -10%, rgba(88,166,255,.14), transparent 60%), var(--bg);
    color:var(--fg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate{width:100%;max-width:400px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px 36px;text-align:center;
    box-shadow:0 24px 60px -24px rgba(0,0,0,.7)}
  .lock{width:64px;height:64px;margin:0 auto 22px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#238636,#1a7f37);box-shadow:0 12px 26px -10px rgba(35,134,54,.8)}
  .lock svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:20px;font-weight:700;margin-bottom:6px}
  p.sub{color:var(--muted);font-size:13.5px;margin-bottom:26px;line-height:1.6}
  form{display:flex;flex-direction:column;gap:12px}
  .field{position:relative}
  .field input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--fg);
    font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.18)}
  button{width:100%;padding:14px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;
    background:linear-gradient(120deg,#238636,#1a7f37);color:#fff;transition:transform .15s,box-shadow .2s}
  button:hover{background:linear-gradient(120deg,#2ea043,#238636);transform:translateY(-1px)}
  .err{color:var(--err);font-size:13px;min-height:18px;font-weight:600}
  .err+.err-slot{display:none}
  .hint{color:var(--muted);font-size:12px;margin-top:18px;line-height:1.6;opacity:.8}
  /* error shake */
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  .shake{animation:shake .5s}
  /* post-login */
  .unlocked{display:none}
  .unlocked.on{display:block;animation:fadeIn .4s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .unlocked .ok{width:56px;height:56px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2ea043,#238636);color:#fff;box-shadow:0 12px 26px -10px rgba(46,160,67,.9)}
  .unlocked h1{margin-bottom:18px}
  .unlocked .acts{display:flex;flex-direction:column;gap:12px}
  .unlocked a{display:block;padding:14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:15px}
  .a-read{background:linear-gradient(120deg,#238636,#1a7f37);color:#fff}
  .a-read:hover{background:linear-gradient(120deg,#2ea043,#238636)}
  .a-pdf{background:var(--card);border:1px solid var(--border);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:10px}
  .a-pdf:hover{border-color:var(--pdf);color:var(--pdf)}
  .pdf-tag{background:linear-gradient(135deg,var(--pdf),#b62324);color:#fff;font-weight:800;font-size:11px;border-radius:6px;padding:3px 7px;letter-spacing:.04em}
  .logout{background:none;border:1px solid var(--border);color:var(--muted);margin-top:16px;padding:10px;font-size:13px;border-radius:8px;cursor:pointer}
  .logout:hover{border-color:var(--err);color:var(--err);background:none}
  @media(prefers-color-scheme:light){
    :root{--bg:#f6f8fa;--card:#ffffff;--border:#d0d7de;--fg:#1f2328;--muted:#57606a}
  }
</style>
</head>
<body>
  <div class="gate">
    <!-- LOGIN STATE -->
    <div id="loginView">
      <div class="lock">
        <svg viewBox="0 0 24 24" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <h1>访问需验证</h1>
      <p class="sub">本书仅对受邀读者开放<br>请输入访问密码后继续</p>
      <form id="form">
        <div class="field">
          <input type="password" id="pwd" placeholder="请输入访问密码" autocomplete="off" autofocus>
        </div>
        <div class="err" id="err"></div>
        <button type="submit">进入</button>
      </form>
      <p class="hint">密码正确后将解锁在线阅读与 PDF 下载。该页面不会在搜索引擎中收录。</p>
    </div>

    <!-- UNLOCKED STATE -->
    <div id="unlockedView" class="unlocked">
      <div class="ok">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>验证通过 ✓</h1>
      <div class="acts">
        <a class="a-read" href="book.html">▶ 在线阅读本书</a>
        <a class="a-pdf" href="Build-a-Reasoning-Model-From-Scratch.pdf" download>
          <span class="pdf-tag">PDF</span> 下载全书 PDF · 29 MB
        </a>
      </div>
      <button class="logout" id="logoutBtn" type="button">退出并清除访问状态</button>
    </div>
  </div>

<script>
  const SESSION_KEY = "_rm_access";
  // SHA-256 of password "rmbook2026"
  const HASH = "313c92e692891912e7d84aa302d08ea117c91670f470313d79fc0168fa6b60e5";

  async function sha256Hex(s){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  async function verify(pwd){
    const h = await sha256Hex(pwd);
    let a=parseInt(HASH,16), b=parseInt(h,16), diff=a^b, ok=true;
    while(diff){ if(diff&1){ ok=false; break; } diff>>>=1; }  // constant-ish time
    return HASH === h && ok;
  }

  const $ = id=>document.getElementById(id);
  function showUnlocked(){
    $("loginView").style.display="none";
    $("unlockedView").classList.add("on");
  }

  $("form").addEventListener("submit", async e=>{
    e.preventDefault();
    const box=$("pwd"), err=$("err"), pwd=box.value;
    err.textContent="";
    if(!pwd){ box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); box.focus(); return; }
    if(await verify(pwd)){
      sessionStorage.setItem(SESSION_KEY,"1");
      $("form").style.display="none";
      showUnlocked();
    }else{
      err.textContent="密码错误，请重试";
      box.value="";
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      box.focus();
    }
  });

  $("logoutBtn").addEventListener("click", ()=>{
    sessionStorage.removeItem(SESSION_KEY);
    location.reload();
  });

  // auto-unlock if already authorized this session
  if(sessionStorage.getItem(SESSION_KEY)==="1") showUnlocked();
</script>
</body>
</html>
